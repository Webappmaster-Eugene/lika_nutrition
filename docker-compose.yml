services:
  lika-nutrition:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3080:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-https://likanutrition.ru}
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - dokploy-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.lika-nutrition.rule=Host(`likanutrition.ru`)"
      - "traefik.http.routers.lika-nutrition.entrypoints=websecure"
      - "traefik.http.routers.lika-nutrition.tls.certresolver=letsencrypt"
      - "traefik.http.services.lika-nutrition.loadbalancer.server.port=80"
      - "com.dokploy.service.name=lika-nutrition"

networks:
  dokploy-network:
    external: true
